<!DOCTYPE html>
<html lang="en">
<head>
    <title>Encoding API Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] { display: none; }

        :root { color-scheme: light dark; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            max-width: 42rem;
            margin: 3rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }
        h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
        h2 { font-size: 1.25rem; margin-top: 2rem; }
        .hint { color: #666; }
        .row { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
        input[type="text"] {
            flex: 1 1 16rem;
            padding: 0.5rem 0.75rem;
            font: inherit;
            border: 1px solid #999;
            border-radius: 0.375rem;
        }
        button {
            padding: 0.5rem 1rem;
            font: inherit;
            border: 1px solid #999;
            border-radius: 0.375rem;
            background: #f3f3f3;
            cursor: pointer;
        }
        button:hover { background: #e5e5e5; }
        .output {
            margin: 0.5rem 0;
            padding: 0.75rem;
            border-radius: 0.375rem;
            background: #f6f6f6;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9rem;
            overflow-wrap: anywhere;
        }
        .meta { font-size: 0.85rem; color: #666; }
        @media (prefers-color-scheme: dark) {
            body { background: #111; color: #eee; }
            .hint, .meta { color: #aaa; }
            input[type="text"], button { border-color: #555; }
            button { background: #222; color: #eee; }
            button:hover { background: #333; }
            .output { background: #1c1c1c; }
        }
    </style>
</head>
<body>
    <h1>Encoding API Demo</h1>
    <div id="main" ws-children-template="Main">
        <h2>UTF-8 Encoding &amp; Decoding</h2>
        <p class="hint">TextEncoder always encodes to UTF-8. TextDecoder can decode many encodings.</p>
        <div class="row">
            <input type="text" id="utf8Input" placeholder="Enter text" ws-var="Utf8Input" />
            <button ws-onclick="EncodeUTF8">Encode</button>
            <button ws-onclick="DecodeUTF8">Decode</button>
        </div>
        <p class="output" id="utf8Encoded">${Utf8Encoded}</p>
        <p class="output" id="utf8Decoded">${Utf8Decoded}</p>
        <p class="meta" id="decoderInfo">${DecoderInfo}</p>
    </div>
    <script type="module" src="Content/WebSharper.Encoding.Sample.min.js"></script>
</body>
</html>
